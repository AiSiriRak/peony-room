info:
  name: Logout
  type: http
  seq: 5

http:
  method: POST
  url: "{{URL}}/auth/logout"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: bru.setVar("token", "");

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
